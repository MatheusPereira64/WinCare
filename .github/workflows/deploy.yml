name: Deploy

# Empacota o WinCare e atualiza a pré-release contínua no GitHub Releases
# a cada push na main. Releases versionadas (v*) continuam no release.yml.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-windows:
    name: Deploy Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          cache: npm

      - name: Align npm with lockfile
        run: npm install -g npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Package WinCare (ZIP)
        run: npm run wincare:package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinCare-Windows-x64
          path: electron-release/WinCare-Windows-x64.zip
          if-no-files-found: error

      - name: Update continuous GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: WinCare Continuous Build
          draft: false
          prerelease: true
          make_latest: false
          files: electron-release/WinCare-Windows-x64.zip
          body: |
            ## Build contínuo (branch `main`)

            ZIP gerado automaticamente no último push da `main`.

            1. Baixe **`WinCare-Windows-x64.zip`** abaixo
            2. Extraia a pasta
            3. Abra **`WinCare.exe`**

            > Para versões estáveis, use as releases com tag `v*` (workflow Release).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
