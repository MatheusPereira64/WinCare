name: Quality

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - development
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, unused & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          cache: npm

      - name: Align npm with lockfile
        run: npm install -g npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unused files and dependencies
        run: npm run knip

      - name: Build (web / TanStack Start)
        run: npm run build

      - name: Build (Electron renderer)
        run: npm run wincare:build
