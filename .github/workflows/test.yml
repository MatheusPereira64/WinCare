name: Test Project

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          cache: npm

      - name: Align npm with lockfile
        run: npm install -g npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
